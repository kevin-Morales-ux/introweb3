<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro Profesional</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Notificación Flotante (Toast) -->
    <div id="toast" class="toast">
        <i id="toastIcon" class="fas fa-check-circle"></i>
        <span id="toastMessage">Operación exitosa</span>
    </div>

    <!-- VENTANA MODAL (POPUP) CUANDO SE ENCUENTRA LA MOTO/PLACA -->
    <div id="modalPlaca" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-motorcycle"></i>
            </div>
            <h3>¡Esta es tu moto!</h3>
            <p id="modalDetallesPlaca" class="modal-text"></p>
            <button type="button" id="cerrarModal" class="btn-primary">Entendido</button>
        </div>
    </div>

    <!-- Banner Superior Estilo App Real -->
    <header class="main-banner">
        <div class="banner-content">
            <div class="banner-icon-container">
                <i class="fas fa-motorcycle"></i>
            </div>
            <div>
                <h1>Gestión de Vehículos y Motos</h1>
                <p>Plataforma interactiva con búsqueda por placa</p>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Formulario de Registro / Edición -->
        <section class="card form-card">
            <div class="card-header">
                <h2 id="formTitle"><i class="fas fa-plus-circle"></i> Registrar Nueva Moto / Propietario</h2>
            </div>
            <form id="registroForm" novalidate>
                <input type="hidden" id="editId" value="">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombres">Nombres del Propietario</label>
                        <input type="text" id="nombres" placeholder="Ej. Juan Carlos" required>
                        <span class="error-message" id="errorNombres"></span>
                    </div>

                    <div class="form-group">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" placeholder="Ej. Pérez Gómez" required>
                        <span class="error-message" id="errorApellidos"></span>
                    </div>

                    <div class="form-group">
                        <label for="correo">Placa del Vehículo</label>
                        <input type="text" id="correo" placeholder="Ej. ABC-1234" required style="text-transform: uppercase;">
                        <span class="error-message" id="errorCorreo"></span>
                    </div>

                    <div class="form-group">
                        <label for="edad">Modelo / Cilindraje</label>
                        <input type="text" id="edad" placeholder="Ej. Rally 250" required>
                        <span class="error-message" id="errorEdad"></span>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="btn-primary" id="btnAccion">
                        <i class="fas fa-plus"></i> Agregar Registro
                    </button>
                    <button type="button" class="btn-secondary" id="btnCancelar" style="display: none;">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <!-- Tabla y Buscador de Placa -->
        <section class="card table-card">
            <div class="table-header-container">
                <h2><i class="fas fa-list"></i> Vehículos Registrados</h2>
                <!-- Buscador rápido por Placa -->
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="inputBuscar" placeholder="Buscar por placa..." style="text-transform: uppercase;">
                </div>
            </div>

            <div class="table-responsive">
                <table id="tablaRegistros">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Placa</th>
                            <th>Modelo</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <tr id="filaVacia">
                            <td colspan="6" class="text-center">No hay registros guardados todavía.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
