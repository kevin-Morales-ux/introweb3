<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personas - CRUD Completo</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Agregamos iconos de FontAwesome para los botones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- 1. BANNER EN LA PARTE SUPERIOR -->
    <header class="main-banner">
        <div class="banner-content">
            <i class="fas fa-users-cog banner-icon"></i>
            <div>
                <h1>Panel de Control</h1>
                <p>Gestión integral de registros de personal</p>
            </div>
        </div>
    </header>

    <main class="container">
        <header class="header">
            <h1>Sistema de Registro</h1>
            <p>Complete el formulario para agregar una nueva persona.</p>
        </header>

        <!-- Formulario de Registro (Se usará también para editar) -->
        <section class="card form-card">
            <h2 id="formTitle">Registrar Nueva Persona</h2>
            <form id="registroForm" novalidate>
                <!-- Campo oculto para saber si estamos editando un ID específico -->
                <input type="hidden" id="editId" value="">
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombres">Nombres</label>
                        <input type="text" id="nombres" placeholder="Ej. Juan Carlos" required>
                        <span class="error-message" id="errorNombres"></span>
                    </div>

                    <div class="form-group">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" placeholder="Ej. Pérez Gómez" required>
                        <span class="error-message" id="errorApellidos"></span>
                    </div>

                    <div class="form-group">
                        <label for="correo">Correo Electrónico</label>
                        <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                        <span class="error-message" id="errorCorreo"></span>
                    </div>

                    <div class="form-group">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" placeholder="Ej. 25" min="1" max="120" required>
                        <span class="error-message" id="errorEdad"></span>
                    </div>
                </div>

                <!-- Botón principal que cambia de texto según la acción -->
                <button type="submit" class="btn-primary" id="btnAccion">Agregar Registro</button>
                <!-- Botón secundario para cancelar la edición -->
                <button type="button" class="btn-secondary" id="btnCancelar" style="display: none;">Cancelar Edición</button>
            </form>
        </section>

        <!-- Tabla de Registros -->
        <section class="card table-card">
            <h2>Personas Registradas</h2>
            <div class="table-responsive">
                <table id="tablaRegistros">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nombres</th>
                            <th>Apellidos</th>
                            <th>Correo Electrónico</th>
                            <th>Edad</th>
                            <!-- 2. NUEVA COLUMNA DE ACCIONES -->
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <tr id="filaVacia">
                            <td colspan="6" class="text-center">No hay registros guardados todavía.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    
</body>
<script src="js/script.js"></script>
</html>
